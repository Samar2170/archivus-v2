apiVersion: v1        # Core Kubernetes API
kind: Secret          # Stores sensitive data; values are base64-encoded at rest (use stringData for plain text input)
metadata:
  name: archivus-backend-config   # Name referenced in the backend deployment's volume section
  namespace: archivus              # Must match the namespace all other resources use
type: Opaque          # Generic secret type — no special Kubernetes handling, just key/value pairs

stringData:
  # stringData lets you write plain text; Kubernetes encodes it to base64 automatically.
  # The key "config.prod.yaml" becomes the filename when this secret is mounted as a volume.
  # IMPORTANT: Replace all CHANGE_ME_* values before deploying.
  config.prod.yaml: |
    mode: prod                      # Tells the backend to run in production mode (reads config.prod.yaml)
    multi_user: true                # Allow multiple user accounts
    default_write_access: true      # New users get write access by default
    user_dir_structure: true        # Each user gets their own directory for files
    user_dir_lock: false            # Don't lock users to their own directories
    master_pin_uploads: true        # Require a PIN for master-user uploads
    master_pin: "CHANGE_ME_PIN"     # The PIN value — must be set since master_pin_uploads is true

    logs_dir: /data/logs            # Write logs to the persistent volume (survives pod restarts)
    storage_db_file: /data/storage.db  # SQLite database path — on the persistent volume so data isn't lost when pod restarts
    base_dir: /data/files           # Root directory where uploaded files are stored

    secret_key: "CHANGE_ME_SECRET_KEY"   # Used to sign JWT tokens — must stay the same or all sessions break
    server_salt: "CHANGE_ME_SERVER_SALT" # Salt for server-side hashing — must stay the same across restarts
    bot_token: "CHANGE_ME_BOT_TOKEN"     # Telegram bot token (leave as placeholder if not using bots)

    backend_config:
      base_url: "0.0.0.0"   # Address the server announces itself at
      port: "8000"           # Port the backend HTTP server listens on
      scheme: http           # http (TLS is handled by the ingress, not the backend itself)
      bind_addr: "0.0.0.0"  # Bind to all interfaces inside the container so Kubernetes can reach it

    frontend_config:
      base_url: "0.0.0.0"   # Frontend address (used internally by the backend for URL generation)
      port: "3000"           # Frontend port
      scheme: http

    allowed_origins:
      - "*"                  # CORS: allow requests from any origin — tighten this to your domain in production
